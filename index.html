
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>♻️ 주간 분리수거 당번 안내</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f3f4f6;
  color: #111827;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.card {
  background: #fff;
  width: 100%;
  max-width: 480px;
  border-radius: 20px;
  padding: 28px 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
  text-align: center;
}

h1 { font-size: 24px; margin: 0 0 8px; }
.sub { font-size: 14px; color: #6b7280; margin-bottom: 24px; }

.today-box {
  background: #eff6ff;
  border: 2px solid #3b82f6;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.day-title {
  font-size: 16px;
  font-weight: 700;
  color: #1d4ed8;
  margin-bottom: 6px;
}

.team-name {
  font-size: 28px;
  font-weight: 900;
  color: #1e3a8a;
  overflow-wrap: anywhere;
}

.schedule-list {
  text-align: left;
  background: #f9fafb;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
  border: 1px solid #e5e7eb;
}

.schedule-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed #e5e7eb;
  font-size: 15px;
}

.schedule-item:last-child { border-bottom: none; }

.bold {
  font-weight: 700;
  color: #111827;
  text-align: right;
}

button {
  width: 100%;
  background: #3b82f6;
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

button:hover { background: #2563eb; }
.voice-button { background: #059669; }
.voice-button:hover { background: #047857; }

.status {
  margin-top: 12px;
  font-size: 13px;
  color: #6b7280;
  line-height: 1.5;
}
</style>
</head>

<body>
<div class="card">
  <h1>♻️ 분리수거 당번 안내</h1>
  <div class="sub">월요일 &amp; 목요일 (한 조가 이번 주 전담)</div>

  <div class="today-box">
    <div class="day-title" id="currentDutyTitle">이번 주 당번 (월/목)</div>
    <div class="team-name" id="currentTeam">-</div>
  </div>

  <div class="schedule-list">
    <div class="schedule-item">
      <span>📅 다음 주 당번 (월/목)</span>
      <span class="bold" id="nextTeam">-</span>
    </div>
    <div class="schedule-item">
      <span>📅 다다음 주 당번 (월/목)</span>
      <span class="bold" id="afterNextTeam">-</span>
    </div>
  </div>

  <button class="voice-button" onclick="speakDuty(false)">
    🔊 이번 주 당번 음성 호명
  </button>

  <button onclick="nextShift()">
    🔄 순번 강제 변경 (다음 조로)
  </button>

  <div class="status" id="voiceStatus">
    월요일·목요일 오전 10시 자동 호명을 설정했습니다.
  </div>
</div>

<script>
"use strict";

// 1. 당번 조 순서
const teams = [
  "윤영주, 정우리",
  "이도혜",
  "김현수",
  "김진석, 김성욱"
];

let shiftOffset = parseInt(
  localStorage.getItem("recycle_offset") || "0", 10
);

if (!Number.isFinite(shiftOffset)) shiftOffset = 0;

// URL 끝에 ?testVoice=1 을 붙이면 요일과 관계없이 자동 음성을 테스트
const testMode =
  new URLSearchParams(window.location.search).get("testVoice") === "1";

let autoStarted = false;

// 2. 당번 계산
function getDutyInfo() {
  const now = new Date();
  const baseMon = new Date(2026, 5, 22);

  const currentDay = now.getDay();
  const diffToMon = currentDay === 0 ? -6 : 1 - currentDay;

  const thisMon = new Date(now);
  thisMon.setDate(now.getDate() + diffToMon);
  thisMon.setHours(0, 0, 0, 0);

  const diffWeeks = Math.round(
    (thisMon - baseMon) / (1000 * 60 * 60 * 24 * 7)
  );

  let thisWeekIndex = (diffWeeks + shiftOffset) % 4;
  if (thisWeekIndex < 0) thisWeekIndex += 4;

  document.getElementById("currentTeam").textContent =
    teams[thisWeekIndex];

  document.getElementById("nextTeam").textContent =
    teams[(thisWeekIndex + 1) % 4];

  document.getElementById("afterNextTeam").textContent =
    teams[(thisWeekIndex + 2) % 4];

  if (currentDay === 1) {
    document.getElementById("currentDutyTitle").textContent =
      "오늘(월요일) 분리수거 당번";
  } else if (currentDay === 4) {
    document.getElementById("currentDutyTitle").textContent =
      "오늘(목요일) 분리수거 당번";
  } else {
    document.getElementById("currentDutyTitle").textContent =
      "이번 주 담당 조 (월/목 전담)";
  }
}

// 3. 오늘 날짜 키
function getTodayKey() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// 4. 음성 안내
function speakDuty(isAuto = false) {
  const status = document.getElementById("voiceStatus");

  if (!("speechSynthesis" in window)) {
    status.textContent = "이 브라우저는 음성 합성을 지원하지 않습니다.";
    return;
  }

  const todayKey = getTodayKey();

  if (isAuto && !testMode) {
    const day = new Date().getDay();

    if (day !== 1 && day !== 4) return;

    if (
      localStorage.getItem("recycle_last_spoken_day") === todayKey
    ) {
      status.textContent = "오늘 자동 안내는 이미 실행되었습니다.";
      return;
    }
  }

  const team = document.getElementById("currentTeam").textContent;

  if (!team || team === "-") {
    status.textContent = "당번 정보를 불러오지 못했습니다.";
    return;
  }

  const message =
    `안내 말씀드립니다. 이번 주 분리수거 당번은 ${team}입니다. ` +
    "쓰레기통을 비워주세요.";

  const synthesis = window.speechSynthesis;
  const utterance = new SpeechSynthesisUtterance(message);

  utterance.lang = "ko-KR";
  utterance.rate = 0.9;
  utterance.pitch = 1;
  utterance.volume = 1;

  // 한국어 음성이 제공되는 경우 우선 사용
  const voices = synthesis.getVoices();
  const koreanVoice = voices.find(
    voice => voice.lang &&
      voice.lang.toLowerCase().startsWith("ko")
  );

  if (koreanVoice) utterance.voice = koreanVoice;

  let started = false;

  utterance.onstart = function() {
    started = true;
    status.textContent = "🔊 당번 안내 방송 중입니다.";

    // 실제 음성 재생이 시작된 경우에만 완료 기록
    if (isAuto && !testMode) {
      localStorage.setItem("recycle_last_spoken_day", todayKey);
    }
  };

  utterance.onend = function() {
    status.textContent = "당번 안내가 완료되었습니다.";
  };

  utterance.onerror = function(event) {
    status.textContent =
      "음성 재생 오류: " + (event.error || "재생 실패") +
      ". 웨일 음성 설정과 자동 실행 옵션을 확인해 주세요.";
  };

  // 이전 음성을 정리한 다음 새 안내를 시작
  synthesis.cancel();

  status.textContent = isAuto
    ? "자동 음성 재생을 시도하고 있습니다."
    : "음성 재생을 시작합니다.";

  // cancel() 직후 바로 speak() 하면 일부 환경에서 누락될 수 있어 지연
  setTimeout(function() {
    try {
      synthesis.speak(utterance);

      // 브라우저가 요청을 받았지만 시작하지 못한 경우 표시
      setTimeout(function() {
        if (!started && !synthesis.speaking) {
          status.textContent =
            "음성 시작이 확인되지 않았습니다. 자동 실행 제한을 확인해 주세요.";
        }
      }, 5000);
    } catch (error) {
      status.textContent = "음성 실행 오류: " + error.message;
    }
  }, 300);
}

// 5. 월요일·목요일 자동 호명
function autoSpeakOnSchedule() {
  const day = new Date().getDay();

  if (!testMode && day !== 1 && day !== 4) {
    return;
  }

  const todayKey = getTodayKey();

  if (
    !testMode &&
    localStorage.getItem("recycle_last_spoken_day") === todayKey
  ) {
    document.getElementById("voiceStatus").textContent =
      "오늘 자동 안내는 이미 실행되었습니다.";
    return;
  }

  if (autoStarted) return;
  autoStarted = true;

  document.getElementById("voiceStatus").textContent =
    "자동 음성 실행을 준비하고 있습니다.";

  // 웨일이 페이지를 연 직후 음성 목록이 준비될 시간을 줌
  setTimeout(function() {
    const synthesis = window.speechSynthesis;

    // 음성 목록 초기화를 요청
    synthesis.getVoices();

    speakDuty(true);
  }, 4000);
}

// 6. 순번 강제 변경
function nextShift() {
  if (confirm("순번을 다음 조로 1주 밀어내겠습니까?")) {
    shiftOffset = (shiftOffset + 1) % 4;
    localStorage.setItem("recycle_offset", String(shiftOffset));
    getDutyInfo();
  }
}

// 7. 초기 실행
getDutyInfo();
autoSpeakOnSchedule();
</script>
</body>
</html>
